{% extends "base.html" %}
{% block title %}Создание публикации{% endblock %}
{% block content %}
<div class="createPostContainer">
    <h1>Создать публикацию</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Опубликовать</button>
    </form>
</div>
{% endblock %}
