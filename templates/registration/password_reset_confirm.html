{% extends "base.html" %}

{% block content %}
<div class="passwordResetConfirm">
    <h1>Установка нового пароля</h1>

    {% if validlink %}
    <p>Введите новый пароль дважды.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Изменить пароль</button>
    </form>
    {% else %}
    <p>
        Ссылка для восстановления пароля недействительна
        или срок её действия истёк.
    </p>

    <a href="{% url 'password_reset' %}">
        Запросить новую ссылку
    </a>
    {% endif %}
</div>
{% endblock %}
