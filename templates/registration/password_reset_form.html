{% extends "base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="resetPasswordContainer">
    <h1>Восстановление пароля</h1>

    <p>Укажите email, который использовали при регистрации.</p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Отправить ссылку</button>
    </form>
</div>
{% endblock %}
