{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="registerContainer">
    <h1>Регистрация</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зарегестрироваться</button>
    </form>

    <p>
        Уже есть аккаунт ?
        <a href="{% url 'login' %}">Войти</a>
    </p>
</div>

{% endblock %}
