{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<div class="loginContainer">
    <h1>Вход в аккаунт</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Войти</button>
    </form>

    <p>
        Нет аккаунта?
        <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
</div>

{% endblock %}
