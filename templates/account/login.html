<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
</head>

<body>
    <div class="loginContainer">
        <h1>Вход в аккаунт</h1>

        {% if form.errors %}
            <p>Неверное имя пользователя или пароль</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Войти</button>
        </form>

        <p>
            Нет аккаунта ?
            <a href="{% url 'register' %}">Зарегестрироваться</a>
        </p>
    </div>
</body>

</html>
